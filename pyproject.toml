[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rar-to-cbz"
version = "1.0.0"
description = "Convert archive files (RAR, ZIP, 7z, TAR) containing manga/comics into CBZ format"
authors = [{ name = "David Thompson", email = "david.thompson.github@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["rarfile", "py7zr"]
keywords = ["cbz", "rar", "zip", "7z", "comic", "manga", "converter", "kindle", "ebook"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/yourusername/cbz_converter"
Repository = "https://github.com/yourusername/cbz_converter"
Issues = "https://github.com/yourusername/cbz_converter/issues"

[project.scripts]
rar-to-cbz = "rar_to_cbz.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
